services:
  # --- Web Application Service ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-multi-container-api:${NODE_ENV:-production}
    container_name: ${NODE_ENV:-production}_web_app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - isolated-backend-net
    depends_on:
      database:
        condition: service_healthy
    logging:
      # Structured JSON logging compatible with CloudWatch Logs agent / FluentBit
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "environment,service"
    labels:
      environment: "${NODE_ENV:-production}"
      service: "api-gateway"
    restart: unless-stopped

  # --- Isolated Database Service ---
  database:
    image: postgres:15-alpine
    container_name: ${NODE_ENV:-production}_postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - isolated-backend-net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

# --- Environment-Scoped Persistent Storage ---
volumes:
  postgres_data:
    name: ${NODE_ENV:-production}_postgres_data
    driver: local

# --- Environment-Scoped Isolated Network ---
networks:
  isolated-backend-net:
    name: ${NODE_ENV:-production}_backend_network
    driver: bridge
